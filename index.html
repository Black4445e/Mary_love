<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Para Mary ❤️🔥</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Trebuchet MS', sans-serif;
    background:url('https://wallpapercave.com/wp/wp6606221.jpg') center/cover no-repeat fixed;
    color:white;
    overflow-x:hidden;
    position:relative;
}

/* Overlay animado */
body::before{
    content:'';
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:linear-gradient(
        45deg,
        rgba(255,102,196,0.08),
        rgba(255,255,255,0.03),
        rgba(255,102,196,0.08)
    );
    animation:fundoAnimado 10s linear infinite;
    z-index:-1;
}

@keyframes fundoAnimado{
    0%{ filter:hue-rotate(0deg); }
    100%{ filter:hue-rotate(360deg); }
}

/* Tela entrada */
#telaEntrada{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.9);
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    z-index:1000;
    padding:20px;
}

#telaEntrada h1{
    font-size:2.8em;
    text-shadow:
        0 0 10px #ff66c4,
        0 0 20px #ff66c4,
        0 0 40px #ff66c4;
    margin-bottom:20px;
}

#telaEntrada p{
    font-size:1.2em;
}

#telaEntrada button{
    margin-top:25px;
    padding:15px 40px;
    font-size:1.2em;
    border:none;
    border-radius:25px;
    cursor:pointer;
    background:linear-gradient(45deg,#ff66c4,#ffd6f7);
    box-shadow:0 0 25px #ff66c4;
    font-weight:bold;
    transition:0.3s;
}

#telaEntrada button:hover{
    transform:scale(1.08);
}

/* Header */
header{
    padding:80px 20px;
    text-align:center;
    background:rgba(0,0,0,0.45);
    backdrop-filter:blur(4px);
}

h1#titulo{
    font-size:3.5em;
    min-height:80px;
    font-family:'Press Start 2P', cursive;

    text-shadow:
        0 0 10px #ff66c4,
        0 0 20px #ff66c4,
        0 0 40px #ff66c4,
        0 0 80px #ff66c4;
}

.subtext{
    margin-top:20px;
    font-size:1.3em;
    text-shadow:0 0 10px #ffc8ff;
}

#contador{
    margin-top:25px;
    font-size:1.2em;
    color:#ffd6f7;
}

/* Container */
.container{
    max-width:950px;
    margin:40px auto;
    padding:20px;
}

/* Cartas */
.card{
    background:rgba(0,0,0,0.6);
    border:2px solid #ff99d9;
    padding:20px;
    border-radius:15px;
    box-shadow:0 0 15px #ff66c480;
    backdrop-filter:blur(6px);
    font-size:1.2em;
    margin:15px 0;
    cursor:pointer;

    opacity:0;
    transform:translateY(30px);

    transition:
        transform 0.5s,
        box-shadow 0.5s,
        opacity 0.6s;
}

.card.show{
    opacity:1;
    transform:translateY(0);
}

.card:hover{
    transform:translateY(-5px) scale(1.02);
    box-shadow:0 0 30px #ff66c4;
}

.card .conteudo{
    display:none;
    margin-top:15px;
    color:#ffe6f7;
}

.card.aberta .conteudo{
    display:block;
}

/* Botão música */
.btn{
    padding:12px 25px;
    font-size:1.1em;
    border-radius:25px;
    cursor:pointer;
    background:linear-gradient(45deg,#ff66c4,#ffd6f7);
    font-weight:bold;
    border:none;
    box-shadow:0 0 15px #ff66c4;
}

/* Footer */
.footer{
    text-align:center;
    padding:30px;
    margin-top:40px;
    background:rgba(0,0,0,0.7);
    color:#ffccf2;
    font-size:1.1em;
}

/* Corações */
.coracao{
    position:fixed;
    color:#ff66c4;
    animation:subir 6s linear infinite;
    opacity:0.8;
    z-index:999;
    pointer-events:none;
}

@keyframes subir{

    0%{
        transform:translateY(100vh) scale(0.5);
        opacity:0;
    }

    50%{
        opacity:1;
    }

    100%{
        transform:translateY(-120vh) scale(1.5);
        opacity:0;
    }

}

/* Mobile */
@media(max-width:700px){

    h1#titulo{
        font-size:1.8em;
        line-height:1.5;
    }

    .card{
        font-size:1em;
    }

    #telaEntrada h1{
        font-size:2em;
    }

    .subtext{
        font-size:1em;
    }

}

</style>
</head>

<body>

<!-- Tela inicial -->
<div id="telaEntrada">

    <h1>Bem-vinda Mary ❤️✨</h1>

    <p>Clique para entrar no nosso universo 💖</p>

    <button onclick="entrar()">Entrar 💗</button>

</div>

<!-- Música -->
<audio id="musica" loop>
    <source src="https://github.com/Black4445e/free-api-like-freefire/raw/main/200%20euros.mp3" type="audio/mpeg">
</audio>

<!-- Header -->
<header>

    <h1 id="titulo"></h1>

    <div class="subtext">
        Declaração feita com carinho… 💖🔥
    </div>

    <div id="contador"></div>

</header>

<!-- Cartas -->
<div class="container" id="cartasContainer"></div>

<!-- Botão música -->
<div style="position:fixed; bottom:20px; right:20px; z-index:1000;">

    <button class="btn" id="btnMusica" onclick="toggleSom()">
        🔊
    </button>

</div>

<!-- Footer -->
<div class="footer">

    Feito com muito carinho para você, Mary 💗✨

</div>

<script>

const musica = document.getElementById('musica');
const btnMusica = document.getElementById('btnMusica');
const cartasContainer = document.getElementById('cartasContainer');

let tituloTexto = "Mary ❤️ Minha Princesa Gamer 🔥";
let i = 0;

/* Contador */
const inicio = new Date("2024-11-20");

setInterval(()=>{

    const agora = new Date();

    const diff = agora - inicio;

    const dias = Math.floor(diff / (1000*60*60*24));

    document.getElementById('contador').innerHTML =
        `Te admirando há ${dias} dias ❤️`;

},1000);

/* Frases */
const frases = [

"Mary, seu sorriso ilumina mais que qualquer sol.",
"Você transforma dias comuns em aventuras mágicas.",
"Seu olhar tem o poder de acalmar minha alma.",
"Cada gesto seu é poesia pura.",
"Você é minha melodia favorita em todos os momentos.",
"Seu abraço é meu lugar seguro.",
"Seus olhos carregam o brilho das estrelas.",
"Mary, você é minha inspiração diária.",
"Com você, até o silêncio é confortável.",
"Você faz meu coração dançar de felicidade.",

"Mary, você é meu sonho mais bonito.",
"Seu carinho é meu tesouro eterno.",
"Você ilumina meu caminho com seu brilho único.",
"Cada olhar seu é pura magia para mim.",
"Você é meu refúgio de amor e alegria.",

];

/* Entrar */
function entrar(){

    document.getElementById('telaEntrada').style.display='none';

    musica.volume = 0;

    musica.play();

    let vol = 0;

    const fade = setInterval(()=>{

        if(vol < 1){

            vol += 0.05;

            musica.volume = vol;

        }else{

            clearInterval(fade);

        }

    },200);

    digitarTitulo();

    mostrarCartas();

}

/* Digitar título */
function digitarTitulo(){

    if(i < tituloTexto.length){

        document.getElementById('titulo').innerHTML += tituloTexto.charAt(i);

        i++;

        setTimeout(digitarTitulo,80);

    }

}

/* Mostrar cartas */
function mostrarCartas(){

    frases.forEach((texto,index)=>{

        const card = document.createElement('div');

        card.className='card';

        card.innerHTML = `

            <h3>💌 Carta ${index+1}</h3>

            <div class="conteudo">
                ${texto}
            </div>

        `;

        card.onclick = ()=>{

            card.classList.toggle('aberta');

        };

        cartasContainer.appendChild(card);

        setTimeout(()=>{

            card.classList.add('show');

        },index*200);

    });

    /* Carta final */
    setTimeout(()=>{

        const final = document.createElement('div');

        final.className='card show aberta';

        final.innerHTML=`

            <h2>❤️ Mensagem Final ❤️</h2>

            <div class="conteudo" style="display:block; margin-top:15px;">

                Obrigado por existir na minha vida ✨<br><br>

                Você deixa meus dias mais felizes,<br>
                mais leves e muito mais especiais 💖

            </div>

        `;

        cartasContainer.appendChild(final);

    }, frases.length * 200 + 1000);

}

/* Música */
function toggleSom(){

    if(musica.paused){

        musica.play();

        btnMusica.textContent="🔊";

    }else{

        musica.pause();

        btnMusica.textContent="❌";

    }

}

/* Corações */
setInterval(()=>{

    const heart = document.createElement('div');

    heart.className='coracao';

    heart.innerHTML='💖';

    heart.style.left=Math.random()*100+'vw';

    heart.style.fontSize=(15+Math.random()*30)+'px';

    document.body.appendChild(heart);

    setTimeout(()=>{

        heart.remove();

    },6000);

},300);

</script>

</body>
</html>
