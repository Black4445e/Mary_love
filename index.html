<!DOCTYPE html><html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fim de um Sonho</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }body {
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #1e1e2f, #3a3a5f);
        color: #ffffff;
        text-align: center;
    }

    .container {
        background: rgba(255, 255, 255, 0.05);
        padding: 50px;
        border-radius: 20px;
        backdrop-filter: blur(10px);
        box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
        max-width: 600px;
        animation: fadeIn 2s ease-in-out;
    }

    h1 {
        font-size: 2.5rem;
        margin-bottom: 20px;
        font-weight: 600;
    }

    p {
        font-size: 1.2rem;
        font-weight: 300;
        line-height: 1.8;
        opacity: 0.9;
    }

    .heart {
        font-size: 3rem;
        margin-top: 30px;
        animation: pulse 2s infinite;
        color: #ff4d6d;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @keyframes pulse {
        0% {
            transform: scale(1);
            opacity: 0.7;
        }
        50% {
            transform: scale(1.2);
            opacity: 1;
        }
        100% {
            transform: scale(1);
            opacity: 0.7;
        }
    }
</style>

</head>
<body>
    <div class="container">
        <h1>Fim de uma Tentativa</h1>
        <p>
            O dono deste site desistiu de tentar algo que nunca vai acontecer.
            <br><br>
            Depois de insistir, sonhar e acreditar,
            hoje ele já não acredita mais no amor.
        </p>
        <div class="heart">❤</div>
    </div>
</body>
</html>
