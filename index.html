<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Para Mary ❤️🔥</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body {
    font-family: 'Trebuchet MS', sans-serif;
    background:
        linear-gradient(rgba(0,0,0,0.88), rgba(0,0,0,0.92)),
        url('https://wallpapercave.com/wp/wp6606221.jpg') center/cover no-repeat fixed;
    color: white;
    overflow-x: hidden;
    position: relative;
}

body::before{
    content:'';
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background:linear-gradient(
        45deg,
        rgba(255,102,196,0.08),
        rgba(255,255,255,0.03),
        rgba(255,102,196,0.08)
    );
    animation:fundoAnimado 10s linear infinite;
    z-index:-1;
}

@keyframes fundoAnimado{
    0%{ filter:hue-rotate(0deg); }
    100%{ filter:hue-rotate(360deg); }
}

#telaEntrada {
    position: fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    background: rgba(0,0,0,0.9);
    display:flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    text-align:center;
    z-index:1000;
    padding:20px;
}

#telaEntrada h1 {
    font-size:2.8em;
    text-shadow:
        0 0 10px #ff66c4,
        0 0 20px #ff66c4,
        0 0 40px #ff66c4;
    margin-bottom:20px;
}

#telaEntrada p{
    font-size:1.2em;
}

#telaEntrada button {
    margin-top:30px;
    padding:15px 40px;
    font-size:1.3em;
    border:none;
    border-radius:25px;
    cursor:pointer;
    background:linear-gradient(45deg,#ff66c4,#ffd6f7);
    box-shadow:0 0 20px #ff66c4;
    font-weight:bold;
    transition:0.3s;
}

#telaEntrada button:hover{
    transform:scale(1.08);
}

header {
    padding:80px 20px;
    text-align:center;
    background: rgba(0,0,0,0.45);
    backdrop-filter: blur(5px);
}

h1#titulo {
    font-size:3.5em;
    min-height:80px;
    font-family:'Press Start 2P', cursive;
    line-height:1.4;
    text-shadow:
        0 0 10px #ff66c4,
        0 0 20px #ff66c4,
        0 0 40px #ff66c4,
        0 0 80px #ff66c4;
}

.subtext {
    font-size:1.3em;
    margin-top:20px;
    text-shadow:0 0 10px #ffc8ff;
}

#contador{
    margin-top:20px;
    font-size:1.2em;
    color:#ffd6f7;
    text-shadow:0 0 10px #ff66c4;
}

.container {
    max-width:900px;
    margin:40px auto;
    padding:20px;
}

.card {
    background: rgba(0,0,0,0.6);
    border:2px solid #ff99d9;
    padding:20px;
    border-radius:14px;
    box-shadow:0 0 15px #ff66c480;
    backdrop-filter: blur(6px);
    font-size:1.2em;
    margin:15px 0;
    cursor:pointer;
    transition:all 0.6s ease;
    opacity:0;
    transform:translateY(30px);
}

.card.show{
    opacity:1;
    transform:translateY(0);
}

.card:hover {
    transform:translateY(-5px) scale(1.01);
    box-shadow:0 0 25px #ff66c4;
}

.card .mensagem{
    display:none;
    margin-top:15px;
    color:#ffe8f7;
}

.card.aberta .mensagem{
    display:block;
}

.card.aberta{
    background:rgba(255,105,180,0.12);
}

.btn {
    padding:10px 25px;
    font-size:1.2em;
    border-radius:25px;
    cursor:pointer;
    background: linear-gradient(45deg,#ff66c4,#ffd6f7);
    font-weight:bold;
    border:none;
    box-shadow:0 0 10px #ff66c4;
}

.footer {
    text-align:center;
    padding:25px;
    margin-top:40px;
    background: rgba(0,0,0,0.7);
    color:#ffccf2;
    font-size:1.1em;
}

.coracao{
    position:fixed;
    color:#ff66c4;
    animation:subir 6s linear infinite;
    font-size:20px;
    opacity:0.7;
    pointer-events:none;
    z-index:999;
}

@keyframes subir{
    0%{
        transform:translateY(100vh) scale(0.5);
        opacity:0;
    }

    50%{
        opacity:1;
    }

    100%{
        transform:translateY(-120vh) scale(1.2);
        opacity:0;
    }
}

.achievement{
    position:fixed;
    top:20px;
    right:-400px;
    background:rgba(0,0,0,0.85);
    border:2px solid #ff66c4;
    padding:15px 20px;
    border-radius:12px;
    box-shadow:0 0 20px #ff66c4;
    transition:0.6s;
    z-index:2000;
}

.achievement.show{
    right:20px;
}

@media(max-width:700px){

    h1#titulo{
        font-size:1.8em;
    }

    .card{
        font-size:1em;
    }

    #telaEntrada h1{
        font-size:2em;
    }

    .subtext{
        font-size:1.05em;
    }

}

</style>
</head>
<body>

<div class="achievement" id="achievement">
    🎮 Achievement desbloqueado:<br>
    <strong>Entrou no coração da Mary ❤️</strong>
</div>

<div id="telaEntrada">
    <h1>Bem-vinda Mary ❤️✨</h1>
    <p>Clique no botão para entrar no site</p>
    <button onclick="entrar()">Entrar 💗</button>
</div>

<audio id="musica" loop>
    <source src="https://github.com/Black4445e/free-api-like-freefire/raw/main/200%20euros.mp3" type="audio/mpeg">
</audio>

<header>
    <h1 id="titulo"></h1>

    <div class="subtext">
        Declaração feita com carinho… 💖🔥
    </div>

    <div id="contador"></div>
</header>

<div class="container" id="cartasContainer"></div>

<div style="position:fixed; bottom:20px; right:20px; z-index:1000;">
    <button class="btn" id="btnMusica" onclick="toggleSom()">🔊</button>
</div>

<div class="footer">
    Feito com muito carinho para você, Mary 💗✨
</div>

<script>

const musica = document.getElementById('musica');
const btnMusica = document.getElementById('btnMusica');
const cartasContainer = document.getElementById('cartasContainer');
const achievement = document.getElementById('achievement');

let tituloTexto = "Mary ❤️ Minha Princesa Gamer 🔥";
let i = 0;

const frases = [
"Mary, seu sorriso ilumina mais que qualquer sol.",
"Você transforma dias comuns em aventuras mágicas.",
"Seu olhar tem o poder de acalmar minha alma.",
"Cada gesto seu é poesia pura.",
"Você é minha melodia favorita em todos os momentos.",
"Seu abraço é meu lugar seguro.",
"Seus olhos carregam o brilho das estrelas.",
"Mary, você é minha inspiração diária.",
"Com você, até o silêncio é confortável.",
"Você faz meu coração dançar de felicidade.",
"Mary, você é meu sonho mais bonito.",
"Você ilumina meu caminho com seu brilho único.",
"Seu carinho transforma qualquer dia ruim em felicidade.",
"Mary, você deixa tudo mais especial.",
"Cada conversa contigo vira uma memória incrível.",
"Seu jeito me faz sorrir sem perceber.",
"Mary, você é meu lugar favorito no mundo.",
"Você é a melhor parte dos meus dias.",
"Seu abraço seria meu vício favorito.",
"Mary, você é mais linda que qualquer pôr do sol.",
"Você faz meu coração acelerar de um jeito único.",
"Cada detalhe seu me encanta mais.",
"Mary, sua presença já melhora tudo.",
"Você é minha coincidência favorita.",
"Seu olhar parece magia pura.",
"Mary, você é diferente de tudo que já conheci.",
"Você deixa minha vida mais leve.",
"Seu sorriso deveria ser patrimônio mundial.",
"Mary, você é meu pensamento favorito.",
"Você transforma momentos simples em especiais.",
"Seu jeito gamer me conquista ainda mais.",
"Mary, você é minha princesa pixelada ❤️",
"Você ilumina até meus dias escuros.",
"Seu carinho vale mais que ouro.",
"Mary, sua voz acalma meu coração.",
"Você é meu combo favorito da vida.",
"Seu sorriso dá mais energia que café.",
"Mary, você é meu universo inteiro.",
"Cada instante contigo parece mágico.",
"Você é meu achievement raro.",
"Mary, você é meu coração em forma de pessoa.",
"Você deixa qualquer lugar mais bonito.",
"Seu jeito me prende completamente.",
"Mary, você faz meu mundo mais colorido.",
"Você é meu pensamento antes de dormir.",
"Seu olhar me desmonta inteiro.",
"Mary, você é meu conforto favorito.",
"Você faz meu coração ficar em paz.",
"Seu carinho é meu lugar seguro.",
"Mary, eu escolheria você em todas as vidas."
];

function entrar(){

    document.getElementById('telaEntrada').style.display='none';

    musica.volume = 0;
    musica.play();

    let vol = 0;

    const fade = setInterval(()=>{

        if(vol < 1){
            vol += 0.05;
            musica.volume = vol;
        }
        else{
            clearInterval(fade);
        }

    },200);

    digitarTitulo();
    mostrarCartas();
    iniciarCoracoes();
    iniciarContador();
    mostrarAchievement();
}

function mostrarAchievement(){

    achievement.classList.add('show');

    setTimeout(()=>{
        achievement.classList.remove('show');
    },5000);
}

function digitarTitulo(){

    if(i < tituloTexto.length){

        document.getElementById('titulo').innerHTML += tituloTexto.charAt(i);

        i++;

        setTimeout(digitarTitulo, 80);
    }
}

function mostrarCartas(){

    frases.forEach((texto, index)=>{

        const card = document.createElement('div');

        card.className='card';

        card.innerHTML=`
            <strong>💌 Carta ${index+1}</strong>
            <div class="mensagem">${texto}</div>
        `;

        card.onclick = ()=>{
            card.classList.toggle('aberta');
        };

        cartasContainer.appendChild(card);

        setTimeout(()=>{
            card.classList.add('show');
        }, index*180);
    });

    setTimeout(()=>{

        const final = document.createElement('div');

        final.className='card show';

        final.innerHTML=`
            <h2>❤️ Eu gosto muito de você ❤️</h2>
            <br>
            <p>
                Obrigado por existir na minha vida ✨<br><br>
                Você deixa tudo mais bonito, mais leve e mais feliz.
            </p>
        `;

        cartasContainer.appendChild(final);

    }, frases.length * 200 + 1200);
}

function toggleSom(){

    if(musica.paused){
        musica.play();
        btnMusica.textContent="🔊";
    }
    else{
        musica.pause();
        btnMusica.textContent="❌";
    }
}

function iniciarCoracoes(){

    setInterval(()=>{

        const heart = document.createElement('div');

        heart.className='coracao';

        heart.innerHTML='💖';

        heart.style.left=Math.random()*100+'vw';

        heart.style.fontSize=(15+Math.random()*30)+'px';

        document.body.appendChild(heart);

        setTimeout(()=>heart.remove(),6000);

    },300);
}

function iniciarContador(){

    const inicio = new Date("2025-01-01");

    setInterval(()=>{

        const agora = new Date();

        const diff = agora - inicio;

        const dias = Math.floor(diff / (1000*60*60*24));

        document.getElementById('contador').innerHTML =
            `Te admirando há ${dias} dias ❤️`;

    },1000);
}

</script>

</body>
</html>
